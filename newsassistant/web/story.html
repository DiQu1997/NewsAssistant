<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsAssistant · 故事报告</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/echarts.min.js"></script>
<style>
.rp-wrap { max-width: 1020px; margin: 0 auto; padding: 0 16px 70px; }

/* ── 图表面板行：弧线 + 证据结构 ─────────────── */
.dash { display: grid; grid-template-columns: 1fr 300px; gap: 12px; margin-top: 16px; }
@media (max-width: 760px) { .dash { grid-template-columns: 1fr; } }
.panel { border: 1px solid var(--hairline-2); background: var(--surface);
  padding: 12px 14px; }
.panel h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
#arc { width: 100%; height: 190px; }
.evrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
.evrow .lbl { width: 86px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: var(--ink-3); }
.evrow .bar { flex: 1; height: 9px; background: var(--surface-2);
  overflow: hidden; display: flex; }
.evrow .bar i { display: block; height: 100%; }
.evrow .n { width: 26px; text-align: right; color: var(--ink-2); }
.t1 { background: var(--st-critical); } .t2 { background: var(--st-serious); }
.t3 { background: var(--s5); } .t4 { background: var(--s3); }
.t5 { background: var(--neutral); }
.tlegend { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--mono);
  font-size: 9px; color: var(--ink-3); margin: 4px 0 12px; }
.tlegend i { display: inline-block; width: 8px; height: 8px; margin-right: 3px;
  vertical-align: -1px; }
.srcbars .bar i { background: var(--s5); }

/* ── 立场天平 ────────────────────────────────── */
.stance { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.stance .strip { flex: 1; height: 10px; display: flex; overflow: hidden;
  background: var(--surface-2); }
.stance .strip i { display: block; height: 100%; }
.stance .strip .p { background: var(--st-good); }
.stance .strip .z { background: var(--neutral); opacity: .45; }
.stance .strip .m { background: var(--st-critical); }
.rp-head { padding: 26px 0 10px; }
.rp-head h1 { font-size: 21px; line-height: 1.5; margin: 0 0 8px; }
.rp-meta { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--mono);
  font-size: 11px; color: var(--ink-3); }
.rp-meta b { color: var(--ink-2); }

.sect { font-family: var(--mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; font-weight: 600; color: var(--ink-2);
  margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--hairline-2); }
.sect small { text-transform: none; letter-spacing: 0; color: var(--ink-3);
  font-weight: 400; margin-left: 10px; }

.syn p { font-size: 14.5px; line-height: 1.85; margin: 0 0 10px; }
.cite { font-family: var(--mono); font-size: 10px; color: var(--s6);
  cursor: pointer; border: 1px solid var(--hairline-2); padding: 0 5px;
  margin-left: 4px; background: none; }
.cite-pop { font-size: 12.5px; line-height: 1.6; border-left: 3px solid var(--s6);
  background: var(--surface-2); padding: 8px 12px; margin: 6px 0 10px; }
.cite-pop .src { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }

.tl { position: relative; padding-left: 20px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px;
  width: 2px; background: var(--hairline-2); }
.tl .ev { position: relative; padding: 4px 0 12px; font-size: 13.5px; line-height: 1.65; }
.tl .ev::before { content: ''; position: absolute; left: -19px; top: 9px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--s5); }
.tl .ev b { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-right: 9px; }

.oq li { font-size: 13.5px; line-height: 1.7; margin-bottom: 6px; }

.deep { border: 1px solid var(--hairline-2); background: var(--surface); }
.deep .blk { padding: 14px 18px; border-bottom: 1px solid var(--hairline); }
.deep .blk:last-child { border-bottom: 0; }
.deep h4 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.deep p { font-size: 13.5px; line-height: 1.8; margin: 0; }
.party { display: grid; grid-template-columns: 130px 1fr 1fr; gap: 10px;
  padding: 8px 0; border-bottom: 1px dashed var(--hairline); font-size: 12.5px;
  line-height: 1.6; }
.party:last-child { border-bottom: 0; }
.party b { font-size: 13px; }
.party .lbl { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
  display: block; }
.scen { display: flex; gap: 10px; padding: 7px 0; font-size: 13px; line-height: 1.6;
  border-bottom: 1px dashed var(--hairline); align-items: baseline; }
.scen:last-child { border-bottom: 0; }
.lk { font-family: var(--mono); font-size: 10px; padding: 1px 7px;
  border: 1px solid var(--hairline-2); white-space: nowrap; }
.lk.high { color: var(--st-critical); } .lk.medium { color: var(--s5); }
.lk.low { color: var(--ink-3); }
.gen-btn { font-family: var(--mono); font-size: 12px; padding: 9px 18px;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--hairline-2);
  cursor: pointer; }
.gen-btn:disabled { color: var(--ink-3); cursor: wait; }
.gen-note { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-left: 12px; }

.doc { display: flex; gap: 12px; padding: 9px 0; font-size: 13px; line-height: 1.55;
  border-bottom: 1px solid color-mix(in srgb, var(--hairline) 55%, transparent);
  align-items: baseline; }
.doc .tier { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
  border: 1px solid var(--hairline-2); padding: 1px 5px; white-space: nowrap; }
.doc .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  white-space: nowrap; min-width: 110px; }
.doc a { color: var(--ink); text-decoration: none; }
.doc a:hover { text-decoration: underline; }
.doc .at { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  margin-left: auto; white-space: nowrap; }
.doc .syn-tag { font-family: var(--mono); font-size: 9.5px; color: var(--s5); }

.claims-grid { display: grid; gap: 8px; }
.claim { font-size: 12.5px; line-height: 1.65; padding: 8px 12px;
  border-left: 3px solid var(--hairline-2); background: var(--surface); }
.claim.neg { border-left-color: var(--st-critical); }
.claim.pos { border-left-color: var(--st-good); }
.claim .src { font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  margin-right: 8px; }
.empty-rp { padding: 50px 0; text-align: center; font-family: var(--mono);
  font-size: 12px; color: var(--ink-3); }
</style>
<style>.navl{display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:10px;color:var(--ink-3);text-decoration:none;letter-spacing:.07em}.navl:hover{color:var(--ink)}</style>
</head>
<body>
<div class="console">
  <div class="rail">
    <div class="brand"><span class="dot"></span><b>NEWSASSISTANT</b></div>
    <div class="railpad"></div>
    <a class="navl" href="/">首页</a>
    <a class="navl" href="/picture">态势图</a>
    <a class="navl" href="/market">行情</a>
    <a class="navl" href="/reading">阅读</a>
    <a class="navl" href="/wrap">复盘</a>
    <a class="navl" href="/admin">Admin</a>
    <button class="tgl" id="theme">主题</button>
  </div>
  <div class="rp-wrap" id="root"><div class="empty-rp">加载中…</div></div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const id = +new URLSearchParams(location.search).get('id');
const LK = { high: '概率较高', medium: '中等', low: '概率较低' };
let claimById = {};

function fmtAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

const cssVar = n => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();
const TIER_CN = { 1: 'L1 一手权威', 2: 'L2 通讯社/备案', 3: 'L3 主流媒体',
                  4: 'L4 机构/专业', 5: 'L5 社区聚合' };

// 故事弧线：每日报道量 + 时间线事件锚点。形状即叙事 —— 爆发、发酵、衰减
function drawArc(s) {
  const el = document.getElementById('arc');
  if (!el || !window.echarts) return;
  const days = {};
  (s.docs || []).forEach(d => {
    if (!d.published_at) return;
    const k = d.published_at.slice(0, 10);
    days[k] = (days[k] || 0) + 1;
  });
  const keys = Object.keys(days).sort();
  if (keys.length < 2) { el.closest('.panel').style.display = 'none'; return; }
  // 补齐空日：断档本身是信息（热度归零又复燃 = 新进展）
  const all = [];
  for (let t = new Date(keys[0]); ; t.setDate(t.getDate() + 1)) {
    const k = t.toISOString().slice(0, 10);
    all.push(k);
    if (k >= keys[keys.length - 1]) break;
    if (all.length > 120) break;
  }
  const evs = (s.timeline || []).map((e, i) => ({ ...e, i: i + 1 }))
    .filter(e => /^\d{4}-\d{2}-\d{2}/.test(e.when || ''))
    .map(e => ({ ...e, day: e.when.slice(0, 10) }))
    .filter(e => e.day >= all[0] && e.day <= all[all.length - 1]);
  const chart = echarts.init(el, null, { renderer: 'canvas' });
  chart.setOption({
    grid: { left: 28, right: 10, top: 22, bottom: 20 },
    tooltip: { trigger: 'axis', backgroundColor: cssVar('--surface'),
      borderColor: cssVar('--hairline-2'), textStyle: {
        color: cssVar('--ink'), fontSize: 11 },
      formatter: ps => {
        const day = ps[0].axisValue;
        let h = `<b>${day}</b> · ${ps[0].data} 篇`;
        evs.filter(e => e.day === day).forEach(e => {
          h += `<br>◆ ${(e.text || e.what || '').slice(0, 60)}`; });
        return h;
      } },
    xAxis: { type: 'category', data: all,
      axisLabel: { color: cssVar('--ink-3'), fontSize: 9,
        formatter: v => v.slice(5) },
      axisLine: { lineStyle: { color: cssVar('--hairline-2') } } },
    yAxis: { type: 'value', minInterval: 1,
      axisLabel: { color: cssVar('--ink-3'), fontSize: 9 },
      splitLine: { lineStyle: { color: cssVar('--hairline') } } },
    series: [{
      type: 'bar', data: all.map(k => days[k] || 0), barMaxWidth: 18,
      itemStyle: { color: cssVar('--s4') },
      markPoint: {
        symbol: 'pin', symbolSize: 26,
        itemStyle: { color: cssVar('--st-serious') },
        label: { color: '#fff', fontSize: 9, fontWeight: 700 },
        data: evs.map(e => ({
          coord: [e.day, (days[e.day] || 0)], value: e.i })) },
    }],
  });
  window._arcChart = chart;
}

function barRow(label, segs, total, n) {
  return `<div class="evrow"><span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="bar">${segs.map(([cls, v]) =>
      `<i class="${cls}" style="width:${(100 * v / total).toFixed(1)}%"></i>`).join('')}</span>
    <span class="n">${n}</span></div>`;
}

// 证据结构：这个故事站在什么底盘上 —— 层级配比 + 谁在供稿 + 转载占比
function evidenceHtml(s) {
  const docs = s.docs || [];
  if (!docs.length) return '';
  const tiers = {};
  const srcs = {};
  let synd = 0;
  docs.forEach(d => {
    tiers[d.evidence_tier] = (tiers[d.evidence_tier] || 0) + 1;
    const name = d.source_name || d.source;
    srcs[name] = (srcs[name] || 0) + 1;
    if (d.syndication_of) synd++;
  });
  const tSegs = [1, 2, 3, 4, 5].filter(t => tiers[t])
    .map(t => [`t${t}`, tiers[t]]);
  const top = Object.entries(srcs).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return `
    <div class="tiers">${barRow('证据层级', tSegs, docs.length, docs.length)}</div>
    <div class="tlegend">${[1, 2, 3, 4, 5].filter(t => tiers[t]).map(t =>
      `<span><i class="t${t}"></i>${TIER_CN[t]} ${tiers[t]}</span>`).join('')}</div>
    <div class="srcbars">${top.map(([name, n]) =>
      barRow(name, [['s', n]], top[0][1], n)).join('')}</div>
    ${synd ? `<div class="tlegend" style="margin-top:8px">转载占比 ${
      Math.round(100 * synd / docs.length)}%（独立报道 ${docs.length - synd} 篇）</div>` : ''}`;
}

// 立场天平：断言墙的正/中/负配比 —— 一眼看出争议度
function stanceHtml(claims) {
  const p = claims.filter(c => c.stance > 0).length;
  const m = claims.filter(c => c.stance < 0).length;
  const z = claims.length - p - m;
  if (!claims.length) return '';
  const seg = (cls, v) => v ? `<i class="${cls}" style="width:${
    (100 * v / claims.length).toFixed(1)}%"></i>` : '';
  return `<div class="stance"><span>支持 ${p}</span>
    <span class="strip">${seg('p', p)}${seg('z', z)}${seg('m', m)}</span>
    <span>中性 ${z} · 反对 ${m}</span></div>`;
}

function citedText(item) {
  const ids = item.claim_ids || [];
  return `${esc(item.text || item.what || '')}${ids.map(i =>
    `<button class="cite" data-c="${i}">${i}</button>`).join('')}`;
}

function deepHtml(r) {
  if (!r) return '';
  return `
    <div class="deep">
      <div class="blk"><h4>背景与成因</h4><p>${esc(r.background)}</p></div>
      <div class="blk"><h4>当前态势</h4><p>${esc(r.situation)}</p></div>
      <div class="blk"><h4>各方 —— 立场与利益</h4>
        ${(r.parties || []).map(p => `<div class="party">
          <b>${esc(p.name)}</b>
          <span><span class="lbl">立场（说的）</span>${esc(p.position)}</span>
          <span><span class="lbl">利益（图的）</span>${esc(p.interest)}</span>
        </div>`).join('')}</div>
      <div class="blk"><h4>传导与影响</h4><p>${esc(r.implications)}</p></div>
      <div class="blk"><h4>情景推演</h4>
        ${(r.scenarios || []).map(s => `<div class="scen">
          <span class="lk ${esc(s.likelihood)}">${LK[s.likelihood] || esc(s.likelihood)}</span>
          <span><b>${esc(s.name)}</b> — 触发：${esc(s.trigger)}</span>
        </div>`).join('')}</div>
      <div class="blk"><h4>值得盯的信号</h4>
        <ul class="oq">${(r.watch || []).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    </div>`;
}

function expandClaims(btn) {
  const grid = document.querySelector('.claims-grid');
  grid.insertAdjacentHTML('beforeend', (window._story.claims || []).slice(80).map(c =>
    `<div class="claim ${c.stance > 0 ? 'pos' : c.stance < 0 ? 'neg' : ''}">
      <span class="src">${esc(c.source)}</span>${esc(c.text)}</div>`).join(''));
  btn.remove();
}

let polling = null;

async function genReport() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '分析员撰写中…（约 2-4 分钟）';
  await fetch(`/api/stories/${id}/report`, { method: 'POST' });
  const before = window._reportAt || null;
  polling = setInterval(async () => {
    const s = await fetch(`/api/stories/${id}`).then(r => r.json());
    if (s.deep_report_at && s.deep_report_at !== before) {
      clearInterval(polling);
      window._story = s;
      render(s);
    }
  }, 10000);
}

function render(s) {
  window._reportAt = s.deep_report_at;
  claimById = Object.fromEntries((s.claims || []).map(c => [c.id, c]));
  const sc = s.scalars || {};
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="rp-head">
      <h1>${esc(s.title)}</h1>
      <div class="rp-meta">
        <span>文档 <b>${sc.docs ?? s.docs?.length ?? '?'}</b></span>
        <span>信源 <b>${sc.breadth ?? '?'}</b></span>
        <span>状态 <b>${esc(s.state)}</b></span>
        <span>更新 <b>${fmtAgo(s.updated_at)}</b></span>
        ${s.synthesized_at ? `<span>综述于 <b>${fmtAgo(s.synthesized_at)}</b></span>` : ''}
      </div>
    </div>

    <div class="dash">
      <div class="panel"><h4>故事弧线 · 每日报道量与关键事件</h4><div id="arc"></div></div>
      <div class="panel"><h4>证据结构</h4>${evidenceHtml(s)}</div>
    </div>

    ${(s.summary || []).length ? `
      <div class="sect">综述<small>每句带 claim 级引用，点编号看断言原文</small></div>
      <div class="syn">${s.summary.map(x => `<p>${citedText(x)}</p>`).join('')}</div>` : ''}

    ${(s.timeline || []).length ? `
      <div class="sect">时间线<small>编号对应弧线图上的锚点</small></div>
      <div class="tl">${s.timeline.map((e, i) =>
        `<div class="ev"><b>${i + 1} · ${esc(e.when)}</b>${citedText(e)}</div>`).join('')}</div>` : ''}

    ${(s.open_questions || []).length ? `
      <div class="sect">开放问题<small>综述回答不了、值得继续跟的</small></div>
      <ul class="oq">${s.open_questions.map(q =>
        `<li>${esc(typeof q === 'string' ? q : q.text || '')}</li>`).join('')}</ul>` : ''}

    <div class="sect">深度报告<small>分析员署名解读 —— 判断可辩，非纯事实</small></div>
    ${s.deep_report ? deepHtml(s.deep_report) + `
      <div style="margin-top:10px"><button class="gen-btn" id="genBtn">重新生成</button>
      <span class="gen-note">生成于 ${new Date(s.deep_report_at).toLocaleString('zh-CN', {hour12: false})}</span></div>`
    : `<button class="gen-btn" id="genBtn">生成深度报告</button>
       <span class="gen-note">背景成因 · 各方立场与利益 · 传导影响 · 情景推演</span>`}

    <div class="sect">断言墙<small>${(s.claims || []).length} 条，左缘色=立场</small></div>
    ${stanceHtml(s.claims || [])}
    <div class="claims-grid">${(s.claims || []).slice(0, 80).map(c =>
      `<div class="claim ${c.stance > 0 ? 'pos' : c.stance < 0 ? 'neg' : ''}">
        <span class="src">${esc(c.source)}</span>${esc(c.text)}</div>`).join('')}</div>
    ${(s.claims || []).length > 80 ? `<button class="gen-btn" style="margin-top:10px"
      onclick="expandClaims(this)">展开全部 ${s.claims.length} 条</button>` : ''}

    <div class="sect">新闻原文<small>${(s.docs || []).length} 篇，点标题去源站</small></div>
    ${(s.docs || []).map(d => `
      <div class="doc">
        <span class="tier">L${d.evidence_tier}</span>
        <span class="src">${esc(d.source)}</span>
        <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title || d.url)}</a>
        ${d.syndication_of ? '<span class="syn-tag">转载</span>' : ''}
        <span class="at">${fmtAgo(d.published_at)}</span>
      </div>`).join('')}
  `;
  drawArc(s);
  root.querySelectorAll('.cite').forEach(b => b.onclick = () => {
    const c = claimById[+b.dataset.c];
    if (!c) return;
    const old = b.parentElement.querySelector('.cite-pop');
    if (old) { old.remove(); return; }
    const pop = document.createElement('div');
    pop.className = 'cite-pop';
    pop.innerHTML = `<span class="src">${esc(c.source)} · claim ${c.id}</span><br>${esc(c.text)}`;
    b.parentElement.appendChild(pop);
  });
  const gb = document.getElementById('genBtn');
  if (gb) gb.onclick = genReport;
}

document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme')
        && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  if (window._story) {                     // 图表颜色取自 CSS 变量，换主题重画
    if (window._arcChart) { window._arcChart.dispose(); window._arcChart = null; }
    render(window._story);
  }
};
addEventListener('resize', () => window._arcChart && window._arcChart.resize());

fetch(`/api/stories/${id}`).then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(s => { window._story = s; render(s); })
  .catch(e => document.getElementById('root').innerHTML =
  `<div class="empty-rp">加载失败：${esc(e.message)}</div>`);
</script>
</body>
</html>
