<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsAssistant · 态势图</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/deck.gl.min.js"></script>
<script src="/g6.min.js"></script>
<style>
.pic-wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
.pic-head { padding: 26px 0 6px; display: flex; align-items: baseline; gap: 14px; }
.pic-head h1 { font-family: var(--mono); font-size: 15px; letter-spacing: .14em;
  text-transform: uppercase; margin: 0; }
.pic-head .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.desks { display: flex; gap: 0; margin-left: auto; border: 1px solid var(--hairline-2); }
.desks button { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  padding: 6px 14px; background: var(--surface); color: var(--ink-3);
  border: 0; border-right: 1px solid var(--hairline-2); cursor: pointer; }
.desks button:last-child { border-right: 0; }
.desks button.on { background: var(--surface-2); color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent); }

.overview { font-size: 15.5px; line-height: 1.75; padding: 14px 18px; margin: 12px 0 26px;
  border-left: 3px solid var(--accent); background: var(--surface-2); }

.sect { font-family: var(--mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; font-weight: 600; color: var(--ink-2);
  margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--hairline-2); }

.theater { border: 1px solid var(--hairline-2); background: var(--surface);
  margin-bottom: 16px; }
.th-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--hairline); }
.th-head b { font-size: 14.5px; }
.tension { display: flex; gap: 3px; margin-left: auto; }
.tension i { width: 14px; height: 6px; background: var(--hairline-2); }
.tension i.on-1, .tension i.on-2 { background: var(--s4); }
.tension i.on-3 { background: var(--s5); }
.tension i.on-4, .tension i.on-5 { background: var(--st-critical); }
.momentum { font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border: 1px solid var(--hairline-2); }
.momentum.rising { color: var(--st-critical); }
.momentum.falling { color: var(--st-good); }
.th-body { padding: 14px 16px; font-size: 14px; line-height: 1.75; }
.th-links { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.th-links span { font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  border: 1px dashed var(--hairline-2); padding: 3px 9px; }

.viz { margin: 4px 16px 14px; border: 1px solid var(--hairline);
  background: var(--surface-2); padding: 12px 14px; }
.viz h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.viz .canvas-host { position: relative; width: 100%; overflow: hidden;
  border-radius: 2px; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--mono);
  font-size: 10px; color: var(--ink-3); padding-top: 8px; }
.map-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 5px 18px; padding-top: 10px; font-size: 12.5px; line-height: 1.5; }
.map-index .mi { display: flex; gap: 7px; align-items: baseline; }
.map-index .mi i { flex: 0 0 auto; width: 17px; height: 17px; border-radius: 50%;
  color: var(--surface); font-style: normal; font-family: var(--mono); font-size: 10.5px;
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  transform: translateY(3px); }
.map-index .mi em { color: var(--ink-3); font-style: normal; font-size: 11.5px; }
.viz-legend i.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  vertical-align: middle; margin-right: 4px; }
.viz-legend i.line { display: inline-block; width: 18px; height: 0;
  border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.viz-legend i.line.dashed { border-top-style: dashed; }
.viz-tl { position: relative; padding-left: 18px; }
.viz-tl::before { content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px; background: var(--hairline-2); }
.viz-tl .ev { position: relative; padding: 3px 0 8px; font-size: 12.5px; line-height: 1.5; }
.viz-tl .ev::before { content: ''; position: absolute; left: -18px; top: 8px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--s5); }
.viz-tl .ev b { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-right: 8px; }
.viz table { border-collapse: collapse; font-size: 12px; width: 100%; }
.viz th, .viz td { border: 1px solid var(--hairline-2); padding: 5px 9px;
  text-align: left; vertical-align: top; }
.viz th { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  background: var(--surface); }
.viz ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }

.opinion { border: 1px solid var(--hairline-2); border-left: 3px solid var(--s6);
  background: var(--surface); padding: 13px 16px; margin-bottom: 12px; }
.op-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.op-head b { font-size: 14px; line-height: 1.6; }
.conf { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  padding: 2px 7px; border: 1px solid var(--hairline-2); white-space: nowrap;
  text-transform: uppercase; }
.conf.high { color: var(--st-critical); }
.conf.medium { color: var(--s5); }
.conf.low { color: var(--ink-3); }
.op-body { font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.op-fals { font-size: 12px; margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--hairline); color: var(--ink-3); }
.op-fals b { font-family: var(--mono); font-size: 10.5px; }

.rev { display: flex; gap: 10px; padding: 9px 0; font-size: 13px; line-height: 1.65;
  border-bottom: 1px solid color-mix(in srgb, var(--hairline) 55%, transparent); }
.rev .v { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px;
  white-space: nowrap; align-self: flex-start; margin-top: 2px;
  border: 1px solid var(--hairline-2); }
.rev .v.confirmed { color: var(--st-good); }
.rev .v.refuted { color: var(--st-critical); }
.rev .v.open { color: var(--ink-3); }
.rev .prior { color: var(--ink-3); text-decoration: underline dotted; }

.empty-pic { padding: 60px 0; text-align: center; font-family: var(--mono);
  font-size: 12px; color: var(--ink-3); }

.th-dive { padding: 0 16px 13px; display: flex; flex-direction: column; gap: 5px; }
.th-dive a { font-size: 12.5px; color: var(--s6); text-decoration: none; }
.th-dive a:hover { text-decoration: underline; }

.peri { border: 1px dashed var(--hairline-2); background: var(--surface);
  padding: 12px 16px; margin-bottom: 10px; }
.peri b { font-size: 13.5px; }
.peri-why { font-size: 12.5px; line-height: 1.7; color: var(--ink-2); margin-top: 4px; }
.peri-esc { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-top: 6px; }
.peri-esc a { color: var(--s6); text-decoration: none; }
</style>
<style>.navl{display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:10px;color:var(--ink-3);text-decoration:none;letter-spacing:.07em}.navl:hover{color:var(--ink)}</style>
</head>
<body>
<div class="console">
  <div class="rail">
    <div class="brand"><span class="dot"></span><b>NEWSASSISTANT</b></div>
    <div class="railpad"></div>
    <a class="navl" href="/">首页</a>
    <a class="navl" href="/picture">态势图</a>
    <a class="navl" href="/market">行情</a>
    <a class="navl" href="/reading">阅读</a>
    <a class="navl" href="/wrap">复盘</a>
    <a class="navl" href="/admin">Admin</a>
    <button class="tgl" id="theme">主题</button>
  </div>
  <div class="pic-wrap">
    <div class="pic-head" id="head">
      <h1>态势图</h1><span class="when" id="when"></span>
      <div class="desks">
        <button data-desk="general" class="on">GENERAL</button>
        <button data-desk="markets">MARKETS</button>
      </div>
    </div>
    <div id="root"><div class="empty-pic">加载中…</div></div>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MOM = { rising: '↗ 升温', holding: '→ 僵持', falling: '↘ 降温' };
const VERDICT = { confirmed: '✓ 证实', refuted: '✗ 被打脸', open: '○ 待定' };
const KIND_CN = { strike: '打击', disaster: '灾害', chokepoint: '航道/咽喉', event: '事件' };
const EDGE_CN = { conflict: '冲突', alliance: '结盟', pressure: '施压',
                  supply: '供应', funding: '资金' };

// ── 主题色：CSS 变量 → hex/rgb 数组（canvas fillStyle 归一化任意颜色格式）──
const _cvs = document.createElement('canvas').getContext('2d');
function norm(c) { _cvs.fillStyle = '#000'; _cvs.fillStyle = c; return _cvs.fillStyle; }
function rgb(c, a = 255) {
  const h = norm(c);
  if (h.startsWith('#'))
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16),
            parseInt(h.slice(5, 7), 16), a];
  const m = h.match(/[\d.]+/g) || [0, 0, 0];
  return [+m[0], +m[1], +m[2], a];
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const T = () => ({
  ink: norm(cssv('--ink')), ink2: norm(cssv('--ink-2')), ink3: norm(cssv('--ink-3')),
  surface: norm(cssv('--surface')), surface2: norm(cssv('--surface-2')),
  hairline: norm(cssv('--hairline-2')),
  crit: norm(cssv('--st-critical')), good: norm(cssv('--st-good')),
  s4: norm(cssv('--s4')), s5: norm(cssv('--s5')), s6: norm(cssv('--s6')),
  font: getComputedStyle(document.body).fontFamily,
});
const MK_COLOR = t => ({ strike: t.crit, disaster: t.s5, chokepoint: t.s6, event: t.s4 });
const EDGE_COLOR = t => ({ conflict: t.crit, alliance: t.good, pressure: t.s5,
                           supply: t.s6, funding: t.s4 });

let charts = [], vizSpecs = [], worldGeo = null;

function chartDiv(h, spec, legend = '') {
  vizSpecs.push(spec);
  return `<div class="canvas-host" data-idx="${vizSpecs.length - 1}"
    style="height:${h}px"></div>${legend}`;
}

// ── 地图：deck.gl ───────────────────────────────────────────
function mountMap(el, v, t) {
  const marks = (v.markers || []).filter(m => isFinite(m.lat) && isFinite(m.lon));
  const arcs = (v.arcs || []);
  const lons = marks.map(m => m.lon), lats = marks.map(m => m.lat);
  arcs.forEach(a => { lons.push(a.a_lon, a.b_lon); lats.push(a.a_lat, a.b_lat); });
  const vp = new deck.WebMercatorViewport({
    width: el.clientWidth || 900, height: el.clientHeight || 460 });
  let { longitude, latitude, zoom } = vp.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 70 });
  zoom = Math.min(zoom, 6.5);
  const mk = MK_COLOR(t);
  const layers = [
    new deck.GeoJsonLayer({
      id: 'world', data: worldGeo, stroked: true, filled: true,
      getFillColor: rgb(t.hairline, 235), getLineColor: rgb(t.surface),
      lineWidthMinPixels: .6,
    }),
    new deck.ArcLayer({
      id: 'arcs', data: arcs, greatCircle: false, getHeight: .5,
      getSourcePosition: a => [a.a_lon, a.a_lat],
      getTargetPosition: a => [a.b_lon, a.b_lat],
      getSourceColor: rgb(t.s5, 210), getTargetColor: rgb(t.crit, 235),
      getWidth: 2.6, pickable: true,
    }),
    new deck.ScatterplotLayer({
      id: 'marks', data: marks, pickable: true,
      getPosition: m => [m.lon, m.lat],
      getFillColor: m => rgb(mk[m.kind] || t.s4),
      getLineColor: rgb(t.surface), stroked: true,
      radiusMinPixels: 10.5, radiusMaxPixels: 10.5, lineWidthMinPixels: 2,
    }),
  ];
  // 弧线悬空端补锚点：端点若不落在任何标记附近，画空心圈示意连接处
  const anchors = [];
  arcs.forEach(a => {
    [[a.a_lon, a.a_lat], [a.b_lon, a.b_lat]].forEach(([lo, la]) => {
      if (!marks.some(m => Math.hypot(m.lon - lo, m.lat - la) < .8))
        anchors.push({ lon: lo, lat: la });
    });
  });
  if (anchors.length)
    layers.push(new deck.ScatterplotLayer({
      id: 'anchors', data: anchors, pickable: false,
      getPosition: a => [a.lon, a.lat],
      filled: false, stroked: true, getLineColor: rgb(t.crit, 220),
      radiusMinPixels: 5.5, radiusMaxPixels: 5.5, lineWidthMinPixels: 2,
    }));
  // 编号徽章 + 图下清单（地图集做法）：点旁自由文字在密簇下永远打架，
  // 编号永不重叠，完整标签移到图例区按号对照
  const W = el.clientWidth || 900, H = el.clientHeight || 460;
  layers.push(new deck.TextLayer({
    id: 'badges', data: marks.map((m, i) => ({ ...m, _n: String(i + 1) })),
    pickable: false,
    getPosition: m => [m.lon, m.lat], getText: m => m._n,
    getSize: m => m._n.length > 1 ? 10.5 : 12, getColor: rgb(t.surface),
    getTextAnchor: 'middle', getAlignmentBaseline: 'center',
    fontFamily: 'system-ui, sans-serif', fontWeight: 700,
    characterSet: 'auto',
    parameters: { depthTest: false },   // pitch 下与圆点 z-fighting 会啃掉字形
  }));
  const dk = new deck.Deck({
    parent: el, width: W, height: H,   // 钉死：视口必须与标签放置的投影一致
    controller: { scrollZoom: false, doubleClickZoom: true },
    initialViewState: { longitude, latitude, zoom, pitch: 32, bearing: 0 },
    layers,
    getTooltip: ({ object }) => object && (object.note || object.label) && {
      html: `<b>${esc(object.label || '')}</b>${object.note ? '<br>' + esc(object.note) : ''}`,
      style: { backgroundColor: t.surface, color: t.ink, fontSize: '12px',
               border: `1px solid ${t.hairline}`, padding: '6px 9px' } },
  });
  return { destroy: () => dk.finalize() };
}

// ── 网络：G6 力导 ───────────────────────────────────────────
function mountNetwork(el, v, t) {
  const nodes = (v.nodes || []).map(n => typeof n === 'string' ? { id: n } : n);
  const edges = (v.edges || []).filter(e =>
    nodes.some(n => n.id === e.a) && nodes.some(n => n.id === e.b));
  const ec = EDGE_COLOR(t);
  const g = new G6.Graph({
    container: el, width: el.clientWidth || 900, height: el.clientHeight || 440,
    fitView: true, fitViewPadding: 28,
    modes: { default: ['drag-canvas', 'drag-node'] },
    layout: { type: 'force', preventOverlap: true, linkDistance: 165,
              nodeSpacing: 42, nodeStrength: -260, edgeStrength: .18 },
    defaultNode: {
      size: 20,
      style: { fill: t.surface, stroke: t.ink2, lineWidth: 1.6,
               shadowColor: t.hairline, shadowBlur: 8, cursor: 'grab' },
      labelCfg: { position: 'bottom', offset: 7,
        style: { fontSize: 12, fill: t.ink, fontFamily: t.font,
                 background: { fill: rgbaStr(t.surface, .85),
                               padding: [2, 4, 2, 4], radius: 3 } } },
    },
    defaultEdge: {
      style: { lineWidth: 1.7, opacity: .9 },
      labelCfg: { autoRotate: true,
        style: { fontSize: 9.5, fill: t.ink3,
                 background: { fill: rgbaStr(t.surface, .9),
                               padding: [1, 3, 1, 3], radius: 2 } } },
    },
  });
  g.data({
    nodes: nodes.map(n => ({ id: n.id, label: n.id })),
    edges: edges.map(e => ({
      source: e.a, target: e.b, label: e.label || '',
      style: { stroke: ec[e.kind] || t.ink3,
               lineDash: e.kind === 'conflict' ? [6, 4] : null } })),
  });
  g.render();
  _settleFit(g);
  return { destroy: () => g.destroy() };
}

// 首帧的 fitView 偶发按错误的包围盒缩放（布局/字体未稳定），布局完成后再校一次
function _settleFit(g) {
  const fit = () => { try { if (!g.destroyed) g.fitView(24); } catch (e) {} };
  g.once('afterlayout', () => setTimeout(fit, 60));
  setTimeout(fit, 400);
}

// ── 传导链：G6 dagre 分层（节点框自适应文字，结构性防重叠）──
function wrap(s, n = 13) {
  const out = [];
  for (let i = 0; i < s.length; i += n) out.push(s.slice(i, i + n));
  return out.slice(0, 3);
}
function causalDepths(v) {
  const names = (v.nodes || []).map(n => typeof n === 'string' ? n : n.id);
  const links = (v.links || []).filter(l =>
    names.includes(l.from) && names.includes(l.to));
  const depth = {};
  names.forEach(n => depth[n] = 0);
  for (let i = 0; i < names.length; i++)
    for (const l of links)
      depth[l.to] = Math.max(depth[l.to], depth[l.from] + 1);
  return { names, links, ranks: Math.max(...Object.values(depth)) + 1 };
}
function mountCausal(el, v, t) {
  const { names, links } = causalDepths(v);
  // 竖向分层：长链横排会被 fitView 压小；竖排每层占满宽度，文字保持可读
  const g = new G6.Graph({
    container: el, width: el.clientWidth || 900, height: el.clientHeight || 380,
    fitView: true, fitViewPadding: 18,
    modes: { default: ['drag-canvas'] },
    layout: { type: 'dagre', rankdir: 'TB', nodesep: 26, ranksep: 34,
              controlPoints: true },
    defaultNode: {
      type: 'rect',
      style: { radius: 7, fill: t.surface, stroke: t.ink2, lineWidth: 1.3,
               shadowColor: t.hairline, shadowBlur: 10 },
      labelCfg: { style: { fontSize: 12, fill: t.ink, fontFamily: t.font,
                           lineHeight: 15 } },
    },
    defaultEdge: {
      type: 'cubic-vertical',
      style: { lineWidth: 1.8, opacity: .95 },
      labelCfg: { autoRotate: false,
        style: { fontSize: 10.5, fontWeight: 700,
                 background: { fill: rgbaStr(t.surface, .92),
                               padding: [1, 4, 1, 4], radius: 3 } } },
    },
  });
  g.data({
    nodes: names.map(n => {
      const lines = wrap(n);
      const w = Math.max(...lines.map(l => l.length)) * 12.5 + 26;
      return { id: n, label: lines.join('\n'), size: [w, lines.length * 17 + 16] };
    }),
    edges: links.map(l => {
      const c = l.sign === '-' ? t.good : t.crit;
      return {
        source: l.from, target: l.to,
        label: l.sign + (l.label ? ' ' + l.label : ''),
        style: { stroke: c, endArrow: { path: G6.Arrow.triangle(7, 9, 0), fill: c } },
        labelCfg: { style: { fill: c } } };
    }),
  });
  g.render();
  _settleFit(g);
  return { destroy: () => g.destroy() };
}
function rgbaStr(c, a) { const [r, g, b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }

async function mountCharts() {
  charts.forEach(c => { try { c.destroy(); } catch (e) {} });
  charts = [];
  if (!vizSpecs.length) return;
  if (!worldGeo && vizSpecs.some(s => s.kind === 'map'))
    worldGeo = await fetch('/world.geo.json').then(r => r.json());
  const t = T();
  document.querySelectorAll('.canvas-host').forEach(el => {
    const spec = vizSpecs[+el.dataset.idx];
    if (!spec) return;
    try {
      charts.push(spec.kind === 'map' ? mountMap(el, spec.v, t)
                : spec.kind === 'network' ? mountNetwork(el, spec.v, t)
                : mountCausal(el, spec.v, t));
    } catch (e) { console.error('viz mount failed', spec.kind, e); }
  });
}

// ── HTML 图 ──
function viz(v) {
  if (!v || v.type === 'none') return '';
  let inner = '';
  if (v.type === 'timeline' && (v.events || []).length) {
    inner = `<div class="viz-tl">` + v.events.map(e =>
      `<div class="ev"><b>${esc(e.when)}</b>${esc(e.what)}</div>`).join('') + `</div>`;
  } else if (v.type === 'matrix' && (v.rows || []).length && (v.cols || []).length) {
    inner = `<table><tr><th></th>${v.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`
      + v.rows.map((r, i) =>
        `<tr><th>${esc(r)}</th>${(v.cells?.[i] || []).map(c =>
          `<td>${esc(c)}</td>`).join('')}</tr>`).join('') + `</table>`;
  } else if (v.type === 'list' && (v.items || []).length) {
    inner = `<ul>${v.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if (v.type === 'map' && (v.markers || []).length) {
    const t = T(), mk = MK_COLOR(t);
    const arcRows = (v.arcs || []).filter(a => a.label).map(a =>
      `<span class="mi"><i style="background:none;color:${t.crit};
        transform:translateY(1px)">⌒</i>${esc(a.label)}</span>`).join('');
    inner = chartDiv(460, { kind: 'map', v },
      `<div class="map-index">${v.markers.map((m, i) =>
        `<span class="mi"><i style="background:${mk[m.kind] || t.s4}">${i + 1}</i>
         ${esc(m.label)}${m.note ? `<em> — ${esc(m.note)}</em>` : ''}</span>`
      ).join('')}${arcRows}</div>
      <div class="viz-legend">${[...new Set(v.markers.map(m => m.kind))].map(k =>
        `<span><i class="dot" style="background:${mk[k] || t.s4}"></i>${KIND_CN[k] || k}</span>`
      ).join('')}${(v.arcs || []).length ?
        `<span><i class="line" style="border-color:${t.crit}"></i>打击/流向弧线</span>` : ''}
      <span style="margin-left:auto">拖拽平移 · 双击缩放</span></div>`);
  } else if (v.type === 'network' && (v.nodes || []).length > 1) {
    const t = T(), ec = EDGE_COLOR(t);
    const kinds = [...new Set((v.edges || []).map(e => e.kind))];
    inner = chartDiv(440, { kind: 'network', v },
      `<div class="viz-legend">${kinds.map(k =>
        `<span><i class="line${k === 'conflict' ? ' dashed' : ''}"
          style="border-color:${ec[k] || t.ink3}"></i>${EDGE_CN[k] || k}</span>`
      ).join('')}</div>`);
  } else if (v.type === 'causal' && (v.links || []).length) {
    const { ranks } = causalDepths(v);
    inner = chartDiv(Math.min(760, Math.max(300, ranks * 96)),
      { kind: 'causal', v },
      `<div class="viz-legend"><span style="color:var(--st-critical)">+ 放大</span>
       <span style="color:var(--st-good)">− 抑制</span></div>`);
  }
  if (!inner) return '';
  return `<div class="viz">${v.title ? `<h4>${esc(v.title)}</h4>` : ''}${inner}</div>`;
}

function render(p) {
  const root = document.getElementById('root');
  vizSpecs = [];
  if (!p) {
    document.getElementById('when').textContent = '';
    root.innerHTML = '<div class="empty-pic">这个 desk 还没有态势图 —— 跑一次 ' +
      '<code>na picture</code>，或等调度器的每日周期。</div>';
    return;
  }
  document.getElementById('when').textContent =
    new Date(p.at).toLocaleString('zh-CN', { hour12: false }) + ' · ' + (p.model || '');
  root.innerHTML = `
    <div class="overview">${esc(p.overview)}</div>

    <div class="sect">剧场</div>
    ${(p.theaters || []).map(t => `
      <div class="theater">
        <div class="th-head">
          <b>${esc(t.name)}</b>
          <span class="momentum ${esc(t.momentum)}">${MOM[t.momentum] || esc(t.momentum)}</span>
          <span class="tension">${[1,2,3,4,5].map(i =>
            `<i class="${i <= t.tension ? 'on-' + t.tension : ''}"></i>`).join('')}</span>
        </div>
        <div class="th-body">${esc(t.narrative)}</div>
        ${viz(t.viz)}
        ${(t.links || []).length ? `<div class="th-links">${t.links.map(l =>
          `<span>⇢ ${esc(l.to)} · ${esc(l.why)}</span>`).join('')}</div>` : ''}
        ${(t.stories || []).length ? `<div class="th-dive">${t.stories.map(st =>
          `<a href="/story?id=${st.id}">↳ ${esc(st.title)}</a>`).join('')}</div>` : ''}
      </div>`).join('')}

    ${(p.periphery || []).length ? `
      <div class="sect">外围信号 —— 不热，但可能重要</div>
      ${p.periphery.map(x => `
        <div class="peri">
          <b>${esc(x.signal)}</b>
          <div class="peri-why">${esc(x.why)}</div>
          <div class="peri-esc">升级条件：${esc(x.escalation)}
            ${x.story_id ? ` · <a href="/story?id=${x.story_id}">查看故事 ↗</a>` : ''}</div>
        </div>`).join('')}` : ''}

    <div class="sect">分析员观点 —— 判断，不是事实</div>
    ${(p.opinions || []).map(o => `
      <div class="opinion">
        <div class="op-head"><b>${esc(o.statement)}</b>
          <span class="conf ${esc(o.confidence)}">${esc(o.confidence)}</span></div>
        <div class="op-body">${esc(o.reasoning)}</div>
        <div class="op-fals"><b>证伪条件</b> ${esc(o.falsifier)}</div>
      </div>`).join('')}

    ${(p.revisions || []).length ? `
      <div class="sect">复盘 —— 昨日观点对账</div>
      ${p.revisions.map(r => `
        <div class="rev"><span class="v ${esc(r.verdict)}">${VERDICT[r.verdict] || esc(r.verdict)}</span>
          <div><span class="prior">${esc(r.prior)}</span><br>${esc(r.note)}</div></div>`).join('')}` : ''}
  `;
  mountCharts();
}

document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme')
        && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  load();   // 图表颜色取自 CSS 变量，换主题后重建
};

let desk = new URLSearchParams(location.search).get('desk') || 'general';

function load() {
  document.querySelectorAll('.desks button').forEach(b =>
    b.classList.toggle('on', b.dataset.desk === desk));
  fetch('/api/picture?desk=' + encodeURIComponent(desk)).then(r => r.json())
    .then(d => render(d.picture))
    .catch(e => document.getElementById('root').innerHTML =
      `<div class="empty-pic">加载失败：${esc(e.message)}</div>`);
}
document.querySelectorAll('.desks button').forEach(b => b.onclick = () => {
  desk = b.dataset.desk;
  history.replaceState(null, '', '?desk=' + desk);
  load();
});
load();
</script>
</body>
</html>
