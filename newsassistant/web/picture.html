<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsAssistant · 态势图</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/echarts.min.js"></script>
<style>
.pic-wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
.pic-head { padding: 26px 0 6px; display: flex; align-items: baseline; gap: 14px; }
.pic-head h1 { font-family: var(--mono); font-size: 15px; letter-spacing: .14em;
  text-transform: uppercase; margin: 0; }
.pic-head .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.desks { display: flex; gap: 0; margin-left: auto; border: 1px solid var(--hairline-2); }
.desks button { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  padding: 6px 14px; background: var(--surface); color: var(--ink-3);
  border: 0; border-right: 1px solid var(--hairline-2); cursor: pointer; }
.desks button:last-child { border-right: 0; }
.desks button.on { background: var(--surface-2); color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent); }

.overview { font-size: 15.5px; line-height: 1.75; padding: 14px 18px; margin: 12px 0 26px;
  border-left: 3px solid var(--accent); background: var(--surface-2); }

.sect { font-family: var(--mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; font-weight: 600; color: var(--ink-2);
  margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--hairline-2); }

.theater { border: 1px solid var(--hairline-2); background: var(--surface);
  margin-bottom: 16px; }
.th-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--hairline); }
.th-head b { font-size: 14.5px; }
.tension { display: flex; gap: 3px; margin-left: auto; }
.tension i { width: 14px; height: 6px; background: var(--hairline-2); }
.tension i.on-1, .tension i.on-2 { background: var(--s4); }
.tension i.on-3 { background: var(--s5); }
.tension i.on-4, .tension i.on-5 { background: var(--st-critical); }
.momentum { font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border: 1px solid var(--hairline-2); }
.momentum.rising { color: var(--st-critical); }
.momentum.falling { color: var(--st-good); }
.th-body { padding: 14px 16px; font-size: 14px; line-height: 1.75; }
.th-links { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.th-links span { font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  border: 1px dashed var(--hairline-2); padding: 3px 9px; }

.viz { margin: 4px 16px 14px; border: 1px solid var(--hairline);
  background: var(--surface-2); padding: 12px 14px; }
.viz h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.viz .echart { width: 100%; }
.viz-tl { position: relative; padding-left: 18px; }
.viz-tl::before { content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px; background: var(--hairline-2); }
.viz-tl .ev { position: relative; padding: 3px 0 8px; font-size: 12.5px; line-height: 1.5; }
.viz-tl .ev::before { content: ''; position: absolute; left: -18px; top: 8px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--s5); }
.viz-tl .ev b { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-right: 8px; }
.viz table { border-collapse: collapse; font-size: 12px; width: 100%; }
.viz th, .viz td { border: 1px solid var(--hairline-2); padding: 5px 9px;
  text-align: left; vertical-align: top; }
.viz th { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  background: var(--surface); }
.viz ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }

.opinion { border: 1px solid var(--hairline-2); border-left: 3px solid var(--s6);
  background: var(--surface); padding: 13px 16px; margin-bottom: 12px; }
.op-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.op-head b { font-size: 14px; line-height: 1.6; }
.conf { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  padding: 2px 7px; border: 1px solid var(--hairline-2); white-space: nowrap;
  text-transform: uppercase; }
.conf.high { color: var(--st-critical); }
.conf.medium { color: var(--s5); }
.conf.low { color: var(--ink-3); }
.op-body { font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.op-fals { font-size: 12px; margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--hairline); color: var(--ink-3); }
.op-fals b { font-family: var(--mono); font-size: 10.5px; }

.rev { display: flex; gap: 10px; padding: 9px 0; font-size: 13px; line-height: 1.65;
  border-bottom: 1px solid color-mix(in srgb, var(--hairline) 55%, transparent); }
.rev .v { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px;
  white-space: nowrap; align-self: flex-start; margin-top: 2px;
  border: 1px solid var(--hairline-2); }
.rev .v.confirmed { color: var(--st-good); }
.rev .v.refuted { color: var(--st-critical); }
.rev .v.open { color: var(--ink-3); }
.rev .prior { color: var(--ink-3); text-decoration: underline dotted; }

.empty-pic { padding: 60px 0; text-align: center; font-family: var(--mono);
  font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="console">
  <div class="rail">
    <div class="brand"><span class="dot"></span><b>NEWSASSISTANT</b></div>
    <div class="railpad"></div>
    <a href="/" style="display:flex;align-items:center;padding:0 14px;font-family:var(--mono);
      font-size:10px;color:var(--ink-3);text-decoration:none;letter-spacing:.07em">← Dashboard</a>
    <button class="tgl" id="theme">主题</button>
  </div>
  <div class="pic-wrap">
    <div class="pic-head" id="head">
      <h1>态势图</h1><span class="when" id="when"></span>
      <div class="desks">
        <button data-desk="general" class="on">GENERAL</button>
        <button data-desk="markets">MARKETS</button>
      </div>
    </div>
    <div id="root"><div class="empty-pic">加载中…</div></div>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MOM = { rising: '↗ 升温', holding: '→ 僵持', falling: '↘ 降温' };
const VERDICT = { confirmed: '✓ 证实', refuted: '✗ 被打脸', open: '○ 待定' };
const KIND_CN = { strike: '打击', disaster: '灾害', chokepoint: '航道/咽喉', event: '事件' };
const EDGE_CN = { conflict: '冲突', alliance: '结盟', pressure: '施压',
                  supply: '供应', funding: '资金' };

// ── 主题色：从 CSS 变量取，跟随明暗主题 ──
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const T = () => ({
  ink: cssv('--ink'), ink2: cssv('--ink-2'), ink3: cssv('--ink-3'),
  surface: cssv('--surface'), hairline: cssv('--hairline-2'),
  crit: cssv('--st-critical'), good: cssv('--st-good'),
  s4: cssv('--s4'), s5: cssv('--s5'), s6: cssv('--s6'),
});
const MK_COLOR = t => ({ strike: t.crit, disaster: t.s5, chokepoint: t.s6, event: t.s4 });
const EDGE_COLOR = t => ({ conflict: t.crit, alliance: t.good, pressure: t.s5,
                           supply: t.s6, funding: t.s4 });

let worldRegistered = false, charts = [], vizSpecs = [];

function chartDiv(h, spec) {
  vizSpecs.push(spec);
  return `<div class="echart" data-idx="${vizSpecs.length - 1}" style="height:${h}px"></div>`;
}

// ── 三种 ECharts 图 ──
function mapOption(v, t) {
  const marks = (v.markers || []).filter(m => isFinite(m.lat) && isFinite(m.lon));
  const lons = marks.map(m => m.lon), lats = marks.map(m => m.lat);
  (v.arcs || []).forEach(a => { lons.push(a.a_lon, a.b_lon); lats.push(a.a_lat, a.b_lat); });
  const padLon = Math.max(6, (Math.max(...lons) - Math.min(...lons)) * .25);
  const padLat = Math.max(4, (Math.max(...lats) - Math.min(...lats)) * .25);
  const mk = MK_COLOR(t);
  return {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', confine: true,
      formatter: p => p.data?.note ? `<b>${esc(p.name)}</b><br>${esc(p.data.note)}` : esc(p.name) },
    geo: {
      map: 'world', roam: true, silent: true,
      boundingCoords: [[Math.min(...lons) - padLon, Math.max(...lats) + padLat],
                       [Math.max(...lons) + padLon, Math.min(...lats) - padLat]],
      itemStyle: { areaColor: t.hairline, borderColor: t.surface, borderWidth: .6 },
    },
    series: [
      {
        type: 'lines', coordinateSystem: 'geo', zlevel: 2,
        data: (v.arcs || []).map(a => ({
          coords: [[a.a_lon, a.a_lat], [a.b_lon, a.b_lat]], name: a.label || '' })),
        lineStyle: { color: t.crit, width: 1.6, type: 'dashed', curveness: .35, opacity: .75 },
        effect: { show: true, period: 5, symbol: 'arrow', symbolSize: 7,
                  color: t.crit, trailLength: .18 },
      },
      {
        type: 'effectScatter', coordinateSystem: 'geo', zlevel: 3,
        rippleEffect: { scale: 2.6, brushType: 'stroke' },
        symbolSize: 9,
        data: marks.map(m => ({
          name: m.label, value: [m.lon, m.lat], note: m.note,
          itemStyle: { color: mk[m.kind] || t.s4 } })),
        label: { show: true, position: 'right', distance: 6, formatter: '{b}',
                 fontSize: 11, color: t.ink,
                 textBorderColor: t.surface, textBorderWidth: 2 },
        labelLayout: { hideOverlap: true, moveOverlap: 'shiftY' },
      },
    ],
  };
}

function networkOption(v, t) {
  const nodes = (v.nodes || []).map(n => typeof n === 'string' ? { id: n } : n);
  const edges = (v.edges || []).filter(e =>
    nodes.some(n => n.id === e.a) && nodes.some(n => n.id === e.b));
  const ec = EDGE_COLOR(t);
  const kinds = [...new Set(edges.map(e => e.kind))];
  return {
    backgroundColor: 'transparent',
    tooltip: { show: false },
    legend: { data: kinds.map(k => EDGE_CN[k] || k), bottom: 0, itemWidth: 18,
      textStyle: { color: t.ink3, fontSize: 10 } },
    series: [{
      type: 'graph', layout: 'force', roam: true, zoom: 1,
      force: { repulsion: 1400, edgeLength: [110, 190], gravity: .12 },
      symbolSize: 16, emphasis: { focus: 'adjacency' },
      data: nodes.map(n => ({
        name: n.id,
        itemStyle: { color: t.surface, borderColor: t.ink2, borderWidth: 1.4 } })),
      edges: edges.map(e => ({
        source: e.a, target: e.b,
        lineStyle: { color: ec[e.kind] || t.ink3, width: 1.6,
                     type: e.kind === 'conflict' ? 'dashed' : 'solid', curveness: .08 },
        label: e.label ? { show: true, formatter: e.label, fontSize: 9,
                           color: t.ink3, backgroundColor: t.surface, padding: [1, 3] }
                       : { show: false } })),
      label: { show: true, position: 'top', fontSize: 11, color: t.ink,
               textBorderColor: t.surface, textBorderWidth: 2 },
      labelLayout: { hideOverlap: true },
      // 图例项与边颜色对应（graph 的 legend 需要 categories，这里用透明 hack 省掉）
    }],
    graphic: kinds.map((k, i) => ({
      type: 'group', left: 12 + i * 84, bottom: 6, children: [
        { type: 'line', shape: { x1: 0, y1: 0, x2: 20, y2: 0 },
          style: { stroke: ec[k] || t.ink3, lineWidth: 2,
                   lineDash: k === 'conflict' ? [5, 3] : null } },
        { type: 'text', left: 24, top: -6,
          style: { text: EDGE_CN[k] || k, fill: t.ink3, fontSize: 10 } }]
    })),
  };
}

function causalOption(v, t) {
  const names = (v.nodes || []).map(n => typeof n === 'string' ? n : n.id);
  const links = (v.links || []).filter(l =>
    names.includes(l.from) && names.includes(l.to));
  const depth = {};
  names.forEach(n => depth[n] = 0);
  for (let i = 0; i < names.length; i++)
    for (const l of links)
      depth[l.to] = Math.max(depth[l.to], depth[l.from] + 1);
  const cols = {};
  names.forEach(n => (cols[depth[n]] = cols[depth[n]] || []).push(n));
  const ncols = Object.keys(cols).length;
  const maxRows = Math.max(...Object.values(cols).map(c => c.length));
  const pos = {};
  Object.entries(cols).forEach(([d, ns]) => {
    ns.forEach((n, i) =>
      pos[n] = [d * (100 / Math.max(ncols - 1, 1)),
                (i + 1) * (100 / (ns.length + 1))]);
  });
  return {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', confine: true, formatter: p =>
      p.dataType === 'edge' ? `${esc(p.data.source)} ${p.data.sign} → ${esc(p.data.target)}`
                            : esc(p.name) },
    series: [{
      type: 'graph', layout: 'none', roam: false,
      coordinateSystem: null, left: 30, right: 110, top: 16, bottom: 16,
      symbol: 'roundRect', symbolSize: [14, 14],
      edgeSymbol: ['none', 'arrow'], edgeSymbolSize: 8,
      data: names.map(n => ({
        name: n, x: pos[n][0], y: pos[n][1],
        itemStyle: { color: t.surface, borderColor: t.ink2, borderWidth: 1.4 } })),
      edges: links.map(l => ({
        source: l.from, target: l.to, sign: l.sign,
        lineStyle: { color: l.sign === '-' ? t.good : t.crit,
                     width: 1.8, curveness: .12 },
        label: { show: true, fontSize: 10, fontWeight: 700,
                 color: l.sign === '-' ? t.good : t.crit,
                 backgroundColor: t.surface, padding: [1, 3],
                 formatter: l.sign + (l.label ? ' ' + l.label : '') } })),
      label: { show: true, position: 'right', distance: 5, fontSize: 11.5,
               color: t.ink, textBorderColor: t.surface, textBorderWidth: 2,
               formatter: p => p.name.length > 15 ? p.name.slice(0, 14) + '…' : p.name },
      labelLayout: { hideOverlap: false },
    }],
  };
}

// ── HTML 图 ──
function viz(v) {
  if (!v || v.type === 'none') return '';
  let inner = '';
  if (v.type === 'timeline' && (v.events || []).length) {
    inner = `<div class="viz-tl">` + v.events.map(e =>
      `<div class="ev"><b>${esc(e.when)}</b>${esc(e.what)}</div>`).join('') + `</div>`;
  } else if (v.type === 'matrix' && (v.rows || []).length && (v.cols || []).length) {
    inner = `<table><tr><th></th>${v.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`
      + v.rows.map((r, i) =>
        `<tr><th>${esc(r)}</th>${(v.cells?.[i] || []).map(c =>
          `<td>${esc(c)}</td>`).join('')}</tr>`).join('') + `</table>`;
  } else if (v.type === 'list' && (v.items || []).length) {
    inner = `<ul>${v.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if (v.type === 'map' && (v.markers || []).length) {
    inner = chartDiv(430, { kind: 'map', v });
  } else if (v.type === 'network' && (v.nodes || []).length > 1) {
    inner = chartDiv(430, { kind: 'network', v });
  } else if (v.type === 'causal' && (v.links || []).length) {
    const names = (v.nodes || []).map(n => typeof n === 'string' ? n : n.id);
    inner = chartDiv(Math.max(240, names.length * 42), { kind: 'causal', v });
  }
  if (!inner) return '';
  return `<div class="viz">${v.title ? `<h4>${esc(v.title)}</h4>` : ''}${inner}</div>`;
}

async function mountCharts() {
  charts.forEach(c => c.dispose());
  charts = [];
  if (!vizSpecs.length) return;
  if (!worldRegistered) {
    const world = await fetch('/world.geo.json').then(r => r.json());
    echarts.registerMap('world', world);
    worldRegistered = true;
  }
  const t = T();
  document.querySelectorAll('.echart').forEach(el => {
    const spec = vizSpecs[+el.dataset.idx];
    if (!spec) return;
    const chart = echarts.init(el);
    chart.setOption(spec.kind === 'map' ? mapOption(spec.v, t)
                  : spec.kind === 'network' ? networkOption(spec.v, t)
                  : causalOption(spec.v, t));
    charts.push(chart);
  });
}
window.addEventListener('resize', () => charts.forEach(c => c.resize()));

function render(p) {
  const root = document.getElementById('root');
  vizSpecs = [];
  if (!p) {
    document.getElementById('when').textContent = '';
    root.innerHTML = '<div class="empty-pic">这个 desk 还没有态势图 —— 跑一次 ' +
      '<code>na picture</code>，或等调度器的每日周期。</div>';
    return;
  }
  document.getElementById('when').textContent =
    new Date(p.at).toLocaleString('zh-CN', { hour12: false }) + ' · ' + (p.model || '');
  root.innerHTML = `
    <div class="overview">${esc(p.overview)}</div>

    <div class="sect">剧场</div>
    ${(p.theaters || []).map(t => `
      <div class="theater">
        <div class="th-head">
          <b>${esc(t.name)}</b>
          <span class="momentum ${esc(t.momentum)}">${MOM[t.momentum] || esc(t.momentum)}</span>
          <span class="tension">${[1,2,3,4,5].map(i =>
            `<i class="${i <= t.tension ? 'on-' + t.tension : ''}"></i>`).join('')}</span>
        </div>
        <div class="th-body">${esc(t.narrative)}</div>
        ${viz(t.viz)}
        ${(t.links || []).length ? `<div class="th-links">${t.links.map(l =>
          `<span>⇢ ${esc(l.to)} · ${esc(l.why)}</span>`).join('')}</div>` : ''}
      </div>`).join('')}

    <div class="sect">分析员观点 —— 判断，不是事实</div>
    ${(p.opinions || []).map(o => `
      <div class="opinion">
        <div class="op-head"><b>${esc(o.statement)}</b>
          <span class="conf ${esc(o.confidence)}">${esc(o.confidence)}</span></div>
        <div class="op-body">${esc(o.reasoning)}</div>
        <div class="op-fals"><b>证伪条件</b> ${esc(o.falsifier)}</div>
      </div>`).join('')}

    ${(p.revisions || []).length ? `
      <div class="sect">复盘 —— 昨日观点对账</div>
      ${p.revisions.map(r => `
        <div class="rev"><span class="v ${esc(r.verdict)}">${VERDICT[r.verdict] || esc(r.verdict)}</span>
          <div><span class="prior">${esc(r.prior)}</span><br>${esc(r.note)}</div></div>`).join('')}` : ''}
  `;
  mountCharts();
}

document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme')
        && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  load();   // 图表颜色取自 CSS 变量，换主题后重建
};

let desk = new URLSearchParams(location.search).get('desk') || 'general';

function load() {
  document.querySelectorAll('.desks button').forEach(b =>
    b.classList.toggle('on', b.dataset.desk === desk));
  fetch('/api/picture?desk=' + encodeURIComponent(desk)).then(r => r.json())
    .then(d => render(d.picture))
    .catch(e => document.getElementById('root').innerHTML =
      `<div class="empty-pic">加载失败：${esc(e.message)}</div>`);
}
document.querySelectorAll('.desks button').forEach(b => b.onclick = () => {
  desk = b.dataset.desk;
  history.replaceState(null, '', '?desk=' + desk);
  load();
});
load();
</script>
</body>
</html>
