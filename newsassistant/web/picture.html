<title>NewsAssistant · 态势图</title>

<link rel="stylesheet" href="/app.css">
<style>
.pic-wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
.pic-head { padding: 26px 0 6px; display: flex; align-items: baseline; gap: 14px; }
.pic-head h1 { font-family: var(--mono); font-size: 15px; letter-spacing: .14em;
  text-transform: uppercase; margin: 0; }
.pic-head .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.desks { display: flex; gap: 0; margin-left: auto; border: 1px solid var(--hairline-2); }
.desks button { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  padding: 6px 14px; background: var(--surface); color: var(--ink-3);
  border: 0; border-right: 1px solid var(--hairline-2); cursor: pointer; }
.desks button:last-child { border-right: 0; }
.desks button.on { background: var(--surface-2); color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent); }

.viz svg { display: block; width: 100%; height: auto; }
.viz .land { fill: color-mix(in srgb, var(--ink-3) 22%, transparent); stroke: none; }
.viz .mk-strike { fill: var(--st-critical); }
.viz .mk-disaster { fill: var(--s5); }
.viz .mk-chokepoint { fill: var(--s6); }
.viz .mk-event { fill: var(--s4); }
.viz .mk-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-2); }
.viz .arc { stroke: var(--st-critical); stroke-width: 1.2; fill: none;
  stroke-dasharray: 4 3; opacity: .8; }
.viz .net-edge { stroke: var(--ink-3); stroke-width: 1; opacity: .6; }
.viz .net-edge.conflict { stroke: var(--st-critical); stroke-dasharray: 5 3; }
.viz .net-edge.alliance { stroke: var(--st-good); }
.viz .net-edge.pressure { stroke: var(--s5); stroke-dasharray: 2 3; }
.viz .net-edge.supply { stroke: var(--s6); }
.viz .net-edge.funding { stroke: var(--s4); }
.viz .net-node { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.viz .net-label { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.viz .edge-label { font-family: var(--mono); font-size: 9px; fill: var(--ink-3); }
.viz .cz-node { fill: var(--surface); stroke: var(--hairline-2); }
.viz .cz-text { font-size: 12px; fill: var(--ink); }
.viz .cz-arrow { stroke-width: 1.4; fill: none; }
.viz .cz-plus { stroke: var(--st-critical); }
.viz .cz-minus { stroke: var(--st-good); }
.viz .cz-sign { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 12px; font-family: var(--mono);
  font-size: 10px; color: var(--ink-3); padding-top: 8px; }

.overview { font-size: 15.5px; line-height: 1.75; padding: 14px 18px; margin: 12px 0 26px;
  border-left: 3px solid var(--accent); background: var(--surface-2); }

.sect { font-family: var(--mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; font-weight: 600; color: var(--ink-2);
  margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--hairline-2); }

.theater { border: 1px solid var(--hairline-2); background: var(--surface);
  margin-bottom: 16px; }
.th-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--hairline); }
.th-head b { font-size: 14.5px; }
.tension { display: flex; gap: 3px; margin-left: auto; }
.tension i { width: 14px; height: 6px; background: var(--hairline-2); }
.tension i.on-1, .tension i.on-2 { background: var(--s4); }
.tension i.on-3 { background: var(--s5); }
.tension i.on-4, .tension i.on-5 { background: var(--st-critical); }
.momentum { font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border: 1px solid var(--hairline-2); }
.momentum.rising { color: var(--st-critical); }
.momentum.falling { color: var(--st-good); }
.th-body { padding: 14px 16px; font-size: 14px; line-height: 1.75; }
.th-links { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.th-links span { font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  border: 1px dashed var(--hairline-2); padding: 3px 9px; }

.viz { margin: 4px 16px 14px; border: 1px solid var(--hairline);
  background: var(--surface-2); padding: 12px 14px; }
.viz h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.viz-tl { position: relative; padding-left: 18px; }
.viz-tl::before { content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px;
  width: 2px; background: var(--hairline-2); }
.viz-tl .ev { position: relative; padding: 3px 0 8px; font-size: 12.5px; line-height: 1.5; }
.viz-tl .ev::before { content: ''; position: absolute; left: -18px; top: 8px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--s5); }
.viz-tl .ev b { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  margin-right: 8px; }
.viz table { border-collapse: collapse; font-size: 12px; width: 100%; }
.viz th, .viz td { border: 1px solid var(--hairline-2); padding: 5px 9px;
  text-align: left; vertical-align: top; }
.viz th { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  background: var(--surface); }
.viz ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }

.opinion { border: 1px solid var(--hairline-2); border-left: 3px solid var(--s6);
  background: var(--surface); padding: 13px 16px; margin-bottom: 12px; }
.op-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.op-head b { font-size: 14px; line-height: 1.6; }
.conf { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  padding: 2px 7px; border: 1px solid var(--hairline-2); white-space: nowrap;
  text-transform: uppercase; }
.conf.high { color: var(--st-critical); }
.conf.medium { color: var(--s5); }
.conf.low { color: var(--ink-3); }
.op-body { font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.op-fals { font-size: 12px; margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--hairline); color: var(--ink-3); }
.op-fals b { font-family: var(--mono); font-size: 10.5px; }

.rev { display: flex; gap: 10px; padding: 9px 0; font-size: 13px; line-height: 1.65;
  border-bottom: 1px solid color-mix(in srgb, var(--hairline) 55%, transparent); }
.rev .v { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px;
  white-space: nowrap; align-self: flex-start; margin-top: 2px;
  border: 1px solid var(--hairline-2); }
.rev .v.confirmed { color: var(--st-good); }
.rev .v.refuted { color: var(--st-critical); }
.rev .v.open { color: var(--ink-3); }
.rev .prior { color: var(--ink-3); text-decoration: underline dotted; }

.empty-pic { padding: 60px 0; text-align: center; font-family: var(--mono);
  font-size: 12px; color: var(--ink-3); }
</style>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MOM = { rising: '↗ 升温', holding: '→ 僵持', falling: '↘ 降温' };
const VERDICT = { confirmed: '✓ 证实', refuted: '✗ 被打脸', open: '○ 待定' };
const KIND_CN = { strike: '打击', disaster: '灾害', chokepoint: '航道/咽喉', event: '事件' };
const px = (lon, lat) => [(lon + 180) / 360 * 1000, (90 - lat) / 180 * 500];

function vizMap(v) {
  const marks = (v.markers || []).filter(m =>
    isFinite(m.lat) && isFinite(m.lon));
  if (!marks.length) return '';
  // 视口自动聚焦标记范围（留边），全球散布时回退整图
  let xs = marks.map(m => px(m.lon, m.lat)[0]), ys = marks.map(m => px(m.lon, m.lat)[1]);
  (v.arcs || []).forEach(a => { [[a.a_lon, a.a_lat], [a.b_lon, a.b_lat]].forEach(([lo, la]) => {
    const p = px(lo, la); xs.push(p[0]); ys.push(p[1]); }); });
  const pad = 60;
  let x0 = Math.max(0, Math.min(...xs) - pad), x1 = Math.min(1000, Math.max(...xs) + pad);
  let y0 = Math.max(0, Math.min(...ys) - pad), y1 = Math.min(500, Math.max(...ys) + pad);
  if (x1 - x0 < 240) { const c = (x0 + x1) / 2; x0 = Math.max(0, c - 120); x1 = x0 + 240; }
  if (y1 - y0 < 130) { const c = (y0 + y1) / 2; y0 = Math.max(0, c - 65); y1 = y0 + 130; }
  const s = Math.max((x1 - x0) / 1000, (y1 - y0) / 500);  // 标记尺寸随缩放
  const r = Math.max(2.5, 5 * s * 2.2), fs = Math.max(7, 11 * s * 2.2);
  const arcs = (v.arcs || []).map(a => {
    const [ax, ay] = px(a.a_lon, a.a_lat), [bx, by] = px(a.b_lon, a.b_lat);
    const mx = (ax + bx) / 2, my = (ay + by) / 2 - Math.hypot(bx - ax, by - ay) * .22;
    return `<path class="arc" d="M${ax},${ay} Q${mx},${my} ${bx},${by}"/>`;
  }).join('');
  const dots = marks.map(m => {
    const [x, y] = px(m.lon, m.lat);
    return `<circle class="mk-${esc(m.kind)}" cx="${x}" cy="${y}" r="${r}"
      ><title>${esc(m.label)}${m.note ? ' — ' + esc(m.note) : ''}</title></circle>
      <text class="mk-label" font-size="${fs}" x="${x + r + 2}" y="${y + 3}">${esc(m.label)}</text>`;
  }).join('');
  const legend = [...new Set(marks.map(m => m.kind))].map(k =>
    `<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;
     vertical-align:middle;margin-right:4px" class="mk-${esc(k)}"></i>${KIND_CN[k] || k}</span>`
  ).join('');
  return `<svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">
    <path class="land" d="${WORLD_PATH}"/>${arcs}${dots}</svg>
    <div class="viz-legend">${legend}</div>`;
}

function vizNetwork(v) {
  const nodes = (v.nodes || []).map(n => ({ ...n }));
  const edges = (v.edges || []).filter(e =>
    nodes.some(n => n.id === e.a) && nodes.some(n => n.id === e.b));
  if (nodes.length < 2) return '';
  const W = 900, H = Math.max(340, nodes.length * 46);
  nodes.forEach((n, i) => {           // 圆环初始化 + 小步力导
    const a = 2 * Math.PI * i / nodes.length;
    n.x = W / 2 + Math.cos(a) * W / 3.2; n.y = H / 2 + Math.sin(a) * H / 3;
  });
  const id2n = Object.fromEntries(nodes.map(n => [n.id, n]));
  for (let it = 0; it < 220; it++) {
    for (const p of nodes) for (const q of nodes) {
      if (p === q) continue;
      let dx = p.x - q.x, dy = p.y - q.y, d2 = Math.max(dx * dx + dy * dy, 100);
      const f = 5200 / d2;
      p.x += dx / Math.sqrt(d2) * f; p.y += dy / Math.sqrt(d2) * f;
    }
    for (const e of edges) {
      const a = id2n[e.a], b = id2n[e.b];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.max(Math.hypot(dx, dy), 1);
      const f = (d - 190) * .015;
      a.x += dx / d * f; a.y += dy / d * f; b.x -= dx / d * f; b.y -= dy / d * f;
    }
    for (const n of nodes) {
      n.x = Math.min(W - 70, Math.max(70, n.x));
      n.y = Math.min(H - 26, Math.max(26, n.y));
    }
  }
  const eh = edges.map(e => {
    const a = id2n[e.a], b = id2n[e.b];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<line class="net-edge ${esc(e.kind)}" x1="${a.x}" y1="${a.y}"
      x2="${b.x}" y2="${b.y}"/>` + (e.label ?
      `<text class="edge-label" x="${mx}" y="${my - 3}" text-anchor="middle">${esc(e.label)}</text>` : '');
  }).join('');
  const nh = nodes.map(n =>
    `<circle class="net-node" cx="${n.x}" cy="${n.y}" r="7"/>
     <text class="net-label" x="${n.x}" y="${n.y - 12}" text-anchor="middle">${esc(n.id)}</text>`
  ).join('');
  const legend = [...new Set(edges.map(e => e.kind))].map(k =>
    `<span><i style="display:inline-block;width:18px;height:0;border-top:2px solid;
     vertical-align:middle;margin-right:4px" class="net-edge ${esc(k)}"></i>${
     ({conflict:'冲突',alliance:'结盟',pressure:'施压',supply:'供应',funding:'资金'})[k] || k}</span>`
  ).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${eh}${nh}</svg><div class="viz-legend">${legend}</div>`;
}

function vizCausal(v) {
  // schema 的 nodes 与 network 共用（{id,kind} 对象），也兼容纯字符串
  const names = (v.nodes || []).map(n => typeof n === 'string' ? n : n.id);
  const links = (v.links || []).filter(l =>
    names.includes(l.from) && names.includes(l.to));
  if (names.length < 2 || !links.length) return '';
  const depth = {};                    // 最长路径分层 → 从左到右
  names.forEach(n => depth[n] = 0);
  for (let i = 0; i < names.length; i++)
    for (const l of links)
      depth[l.to] = Math.max(depth[l.to], depth[l.from] + 1);
  const cols = {};
  names.forEach(n => (cols[depth[n]] = cols[depth[n]] || []).push(n));
  const NW = 148, NH = 40, GX = 74, GY = 18;
  const ncols = Object.keys(cols).length;
  const H = Math.max(...Object.values(cols).map(c => c.length)) * (NH + GY) + 20;
  const W = ncols * NW + (ncols - 1) * GX + 20;
  const pos = {};
  Object.entries(cols).forEach(([d, ns]) => {
    const x = 10 + d * (NW + GX);
    const start = (H - ns.length * (NH + GY) + GY) / 2;
    ns.forEach((n, i) => pos[n] = { x, y: start + i * (NH + GY) });
  });
  const eh = links.map(l => {
    const a = pos[l.from], b = pos[l.to];
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    const mx = (x1 + x2) / 2;
    const cls = l.sign === '-' ? 'cz-minus' : 'cz-plus';
    return `<path class="cz-arrow ${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}"
      marker-end="url(#czhead)"/>
      <text class="cz-sign ${cls}" style="stroke:none;fill:currentColor"
        x="${mx}" y="${(y1 + y2) / 2 - 5}" text-anchor="middle">${l.sign}${
        l.label ? ' ' + esc(l.label) : ''}</text>`;
  }).join('');
  const nh = names.map(n => {
    const p = pos[n];
    return `<rect class="cz-node" x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="3"/>
      <text class="cz-text" x="${p.x + NW / 2}" y="${p.y + NH / 2 + 4}"
        text-anchor="middle">${esc(n.length > 13 ? n.slice(0, 12) + '…' : n)}</text>`;
  }).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 900)}px">
    <defs><marker id="czhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor" style="fill:var(--ink-2)"/></marker></defs>
    ${eh}${nh}</svg></div>
    <div class="viz-legend"><span style="color:var(--st-critical)">+ 放大</span>
    <span style="color:var(--st-good)">− 抑制</span></div>`;
}

function viz(v) {
  if (!v || v.type === 'none') return '';
  let inner = '';
  if (v.type === 'timeline' && (v.events || []).length) {
    inner = `<div class="viz-tl">` + v.events.map(e =>
      `<div class="ev"><b>${esc(e.when)}</b>${esc(e.what)}</div>`).join('') + `</div>`;
  } else if (v.type === 'matrix' && (v.rows || []).length && (v.cols || []).length) {
    inner = `<table><tr><th></th>${v.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`
      + v.rows.map((r, i) =>
        `<tr><th>${esc(r)}</th>${(v.cells?.[i] || []).map(c =>
          `<td>${esc(c)}</td>`).join('')}</tr>`).join('') + `</table>`;
  } else if (v.type === 'list' && (v.items || []).length) {
    inner = `<ul>${v.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if (v.type === 'map') {
    inner = vizMap(v);
  } else if (v.type === 'network') {
    inner = vizNetwork(v);
  } else if (v.type === 'causal') {
    inner = vizCausal(v);
  }
  if (!inner) return '';
  return `<div class="viz">${v.title ? `<h4>${esc(v.title)}</h4>` : ''}${inner}</div>`;
}

function render(p) {
  const root = document.getElementById('root');
  if (!p) {
    document.getElementById('when').textContent = '';
    root.innerHTML = '<div class="empty-pic">这个 desk 还没有态势图 —— 跑一次 ' +
      '<code>na picture</code>，或等调度器的每日周期。</div>';
    return;
  }
  document.getElementById('when').textContent =
    new Date(p.at).toLocaleString('zh-CN', { hour12: false }) + ' · ' + (p.model || '');
  root.innerHTML = `
    <div class="overview">${esc(p.overview)}</div>

    <div class="sect">剧场</div>
    ${(p.theaters || []).map(t => `
      <div class="theater">
        <div class="th-head">
          <b>${esc(t.name)}</b>
          <span class="momentum ${esc(t.momentum)}">${MOM[t.momentum] || esc(t.momentum)}</span>
          <span class="tension">${[1,2,3,4,5].map(i =>
            `<i class="${i <= t.tension ? 'on-' + t.tension : ''}"></i>`).join('')}</span>
        </div>
        <div class="th-body">${esc(t.narrative)}</div>
        ${viz(t.viz)}
        ${(t.links || []).length ? `<div class="th-links">${t.links.map(l =>
          `<span>⇢ ${esc(l.to)} · ${esc(l.why)}</span>`).join('')}</div>` : ''}
      </div>`).join('')}

    <div class="sect">分析员观点 —— 判断，不是事实</div>
    ${(p.opinions || []).map(o => `
      <div class="opinion">
        <div class="op-head"><b>${esc(o.statement)}</b>
          <span class="conf ${esc(o.confidence)}">${esc(o.confidence)}</span></div>
        <div class="op-body">${esc(o.reasoning)}</div>
        <div class="op-fals"><b>证伪条件</b> ${esc(o.falsifier)}</div>
      </div>`).join('')}

    ${(p.revisions || []).length ? `
      <div class="sect">复盘 —— 昨日观点对账</div>
      ${p.revisions.map(r => `
        <div class="rev"><span class="v ${esc(r.verdict)}">${VERDICT[r.verdict] || esc(r.verdict)}</span>
          <div><span class="prior">${esc(r.prior)}</span><br>${esc(r.note)}</div></div>`).join('')}` : ''}
  `;
}

document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme')
        && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

let desk = new URLSearchParams(location.search).get('desk') || 'general';

function load() {
  document.querySelectorAll('.desks button').forEach(b =>
    b.classList.toggle('on', b.dataset.desk === desk));
  fetch('/api/picture?desk=' + encodeURIComponent(desk)).then(r => r.json())
    .then(d => render(d.picture))
    .catch(e => document.getElementById('root').innerHTML =
      `<div class="empty-pic">加载失败：${esc(e.message)}</div>`);
}
document.querySelectorAll('.desks button').forEach(b => b.onclick = () => {
  desk = b.dataset.desk;
  history.replaceState(null, '', '?desk=' + desk);
  load();
});
load();
</script>
