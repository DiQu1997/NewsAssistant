# 种子源 —— 初始化 sources 表用；运行后表是唯一权威。
#
# 选择原则（docs/sources.md）：通用、跨领域、跨证据层级 —— 不预设主题。
# kind: rss/atom = feed 源；kind: api = 走 adapter 解析 JSON（newsassistant/apisources.py）。
# legal.redistribute=false 表示只存指针与摘要用于内部处理，不再分发原文。

# ═══════════════════════════════════════════════════════════════
# L1 · 一手权威文件
# ═══════════════════════════════════════════════════════════════
- key: federal-register
  name: Federal Register（美国联邦公报）
  kind: rss
  url: https://www.federalregister.gov/api/v1/documents.rss
  evidence_tier: 1
  cadence_minutes: 360
  revises: false
  lang: en
  region: US
  legal: { license: public-domain, redistribute: true }
  fetch_article: false
  notes: 规则、公告的官方文本；分歧矩阵的锚点层。全文走 API（阶段 1.5）

- key: sec-8k-filings
  name: SEC EDGAR 8-K 实时备案
  kind: api
  adapter: edgar_fulltext
  url: "https://efts.sec.gov/LATEST/search-index?q=&forms=8-K"
  evidence_tier: 2
  cadence_minutes: 120
  lang: en
  region: US
  legal: { license: public-domain, redistribute: true, note: "SEC 要求 UA 带联系方式（NA_USER_AGENT）与 ≥1s 间隔" }
  fetch_via: curl
  fetch_article: false
  notes: 重大事件披露；条目字段含 8-K item 编号、期间、CIK、文件号

