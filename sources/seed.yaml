- key: usgs-quakes-m45
  name: USGS 地震 M4.5+（全球，日窗口）
  kind: atom
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
  evidence_tier: 3
  cadence_minutes: 60
  lang: en
  legal: { license: public-domain, redistribute: true }
  fetch_article: false
  enabled: false
  notes: 已停用：全球每天几十次 4.5+ 小震全是噪音，重大地震走 significant feed

- key: usgs-quakes-significant
  name: USGS 重大地震（官方 significant 判定，周窗口）
  kind: atom
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_week.atom
  evidence_tier: 3
  cadence_minutes: 60
  lang: en
  legal: { license: public-domain, redistribute: true }
  fetch_article: false
  notes: significant 由 USGS 按震级+PAGER 伤亡预估+有感报告综合判定，非纯震级阈值

- key: gdacs-alerts
  name: GDACS 全球灾害警报（UN/EC，多灾种，仅橙/红级）
  kind: api
  adapter: gdacs_events
  url: "https://api.gdacs.org/api/events/geteventlist/SEARCH?alertlevel=Orange;Red"
  evidence_tier: 3
  cadence_minutes: 60
  lang: en
  legal: { license: public-domain, redistribute: true }
  fetch_article: false
  notes: 地震/台风/洪水/火山/海啸/干旱/林火；RSS 出口不能按级过滤（Green 噪音占大头），走 JSON API 只取橙/红

