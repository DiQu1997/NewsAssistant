# 种子源 —— 初始化 sources 表用；运行后表是唯一权威。
#
# 选择原则（docs/sources.md）：通用、跨领域、跨证据层级 —— 不预设主题。
# kind: rss/atom = feed 源；kind: api = 走 adapter 解析 JSON（newsassistant/apisources.py）。
# legal.redistribute=false 表示只存指针与摘要用于内部处理，不再分发原文。

# ── L1 · 一手权威文件 ──────────────────────────────────────
- key: federal-register
  name: Federal Register（美国联邦公报）
  kind: rss
  url: https://www.federalregister.gov/api/v1/documents.rss
  evidence_tier: 1
  cadence_minutes: 360
  revises: false
  lang: en
  region: US
  legal: { license: public-domain, redistribute: true }
  fetch_article: false   # 文档页有反爬拦截页（首轮采集 50 篇同一张"Request Access"）；feed 摘要即载荷
  notes: 规则、公告的官方文本；分歧矩阵的锚点层。全文走 API（阶段 1.5）

- key: sec-8k-filings
  name: SEC EDGAR 8-K 实时备案
  kind: api
  adapter: edgar_fulltext
  # 全文检索端点，q 留空 = 不加主题过滤，按备案时间倒序的最近 8-K（每页 100 条）
  url: "https://efts.sec.gov/LATEST/search-index?q=&forms=8-K"
  evidence_tier: 2
  cadence_minutes: 120
  lang: en
  region: US
  legal: { license: public-domain, redistribute: true, note: "SEC 要求 UA 带联系方式（NA_USER_AGENT）与 ≥1s 间隔" }
  fetch_via: auto        # browse-edgar 的 atom 出口曾被 TLS 指纹拦截（同 UA 下 curl 可过）；auto = httpx 优先、被拦回退 curl
  fetch_article: false   # 备案文件是 htm/XBRL 附件，条目里的结构化事实即载荷
  notes: 重大事件披露；条目字段含 8-K item 编号、期间、CIK、文件号

# ── L3 · 结构化遥测 ────────────────────────────────────────
- key: usgs-quakes-m45
  name: USGS 地震 M4.5+（全球，日窗口）
  kind: atom
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
  evidence_tier: 3
  cadence_minutes: 60
  lang: en
  legal: { license: public-domain, redistribute: true }
  fetch_article: false   # 事件页是 JS 应用；feed 摘要（时间/坐标/深度）即全部内容
  notes: 传感器级数值源示例

# ── L4 · 学术与技术产出 ────────────────────────────────────
- key: arxiv-csai
  name: arXiv cs.AI 新论文
  kind: rss
  url: https://rss.arxiv.org/rss/cs.AI
  evidence_tier: 4
  cadence_minutes: 720
  lang: en
  legal: { license: varies, redistribute: false }
  fetch_article: false   # 摘要即载荷，不抓页面更不抓 PDF
  notes: ~

